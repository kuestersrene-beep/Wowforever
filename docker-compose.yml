services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SURVEY_DEADLINE: ${NEXT_PUBLIC_SURVEY_DEADLINE}
        NEXT_PUBLIC_LAUNCH_DATE: ${NEXT_PUBLIC_LAUNCH_DATE}
    restart: unless-stopped
    env_file:
      - .env
    # Nur auf localhost erreichbar - das bereits laufende nginx auf dem
    # Server nimmt Anfragen von außen entgegen und leitet sie intern an
    # diesen Port weiter (siehe deploy/nginx-wowforever.conf.example).
    ports:
      - "127.0.0.1:3001:3000"
